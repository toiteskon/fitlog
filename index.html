function sheet(html){closeSheet();var b=document.createElement('div');b.className='sheet-bg';b.id='sheetbg';b.innerHTML='<div class="sheet"><div class="grab"></div>'+html+'</div>';b.addEventListener('click',function(e){if(e.target===b)closeSheet();});document.body.appendChild(b);}
function closeSheet(){var b=document.getElementById('sheetbg');if(b)b.remove();}
function confirmSheet(title,msg,ok,cb,danger){SHEET_CB=cb;sheet('<h2>'+title+'</h2><p class="sub" style="font-size:14px">'+msg+'</p><div class="grid2" style="margin-top:14px"><button class="btn" data-act="closeSheet">Annuler</button><button class="btn '+(danger?'bad':'pri')+'" data-act="confirmOk">'+ok+'</button></div>');}
function bar(v,g,col){var p=g>0?Math.min(100,v/g*100):0;return '<div class="bar"><i style="width:'+p+'%;background:'+col+'"></i></div>';}
function macro(l,v,g,col){return '<div class="mac"><div class="row sp"><span style="font-weight:600">'+l+'</span><span class="sub">'+Math.round(v)+' / '+g+' g</span></div>'+bar(v,g,col)+'</div>';}
function ring(v,g,size){size=size||128;var r=size/2-10,C=2*Math.PI*r,p=g>0?Math.min(1,v/g):0,over=v>g;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#2a2f39" stroke-width="10"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(over?'#ff6b8b':'#ff7a1a')+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C*p+' '+C+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="46%" text-anchor="middle" fill="#eef1f5" font-size="24" font-weight="800">'+fmt(Math.abs(g-v))+'</text><text x="50%" y="62%" text-anchor="middle" fill="#8b93a1" font-size="11">'+(over?'kcal en trop':'kcal restantes')+'</text></svg>';}
function lineChart(pts,o){o=o||{};if(pts.length<2)return '<div class="empty">Pas encore assez de données pour un graphique</div>';var W=320,H=o.h||150,pl=36,pr=10,pt=12,pb=22;var ys=pts.map(function(p){return p.y;});var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mn===mx){mn-=1;mx+=1;}var padv=(mx-mn)*0.15;mn-=padv;mx+=padv;function X(i){return pl+(W-pl-pr)*i/(pts.length-1);}function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');var area=d+' L'+X(pts.length-1)+' '+(H-pb)+' L'+pl+' '+(H-pb)+' Z';var g='';for(var k=0;k<3;k++){var v=mn+(mx-mn)*(k+0.5)/3;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#2a2f39" stroke-dasharray="3 4"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" fill="#8b93a1" font-size="10">'+r1(v)+'</text>';}var dots=pts.length<=30?pts.map(function(p,i){return '<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="3" fill="#ff7a1a"/>';}).join(''):'';return '<svg viewBox="0 0 '+W+' '+H+'" width="100%"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity=".25"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#lg)"/><path d="'+d+'" fill="none" stroke="#ff7a1a" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'<text x="'+pl+'" y="'+(H-6)+'" fill="#8b93a1" font-size="10">'+esc(pts[0].x)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" fill="#8b93a1" font-size="10">'+esc(pts[pts.length-1].x)+'</text></svg>';}
function barChart(items,o){o=o||{};var W=320,H=o.h||140,pb=20,pt=16;var mx=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));var bw=(W-10)/items.length;return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+items.map(function(it,i){var h=(H-pb-pt)*it.v/mx;var x=5+i*bw+bw*0.18;return '<rect x="'+x+'" y="'+(H-pb-h)+'" width="'+bw*0.64+'" height="'+Math.max(h,1)+'" rx="4" fill="'+(it.hi?'#ff7a1a':'#3b4350')+'"/>'+(it.v?'<text x="'+(x+bw*0.32)+'" y="'+(H-pb-h-4)+'" text-anchor="middle" fill="#eef1f5" font-size="10" font-weight="700">'+(o.fmt?o.fmt(it.v):it.v)+'</text>':'')+'<text x="'+(x+bw*0.32)+'" y="'+(H-5)+'" text-anchor="middle" fill="#8b93a1" font-size="9">'+esc(it.l)+'</text>';}).join('')+'</svg>';}
function waterRow(k){var n=S.water[k]||0,g=S.goals.water||8,h='';for(var i=0;i<Math.max(g,n);i++){var on=i<n;h+='<button data-act="water" data-n="'+(i+1)+'" data-d="'+k+'" aria-label="verre"><svg viewBox="0 0 24 30" width="26" height="32"><path d="M4 3h16l-2 24H6z" fill="'+(on?'#5fa8ff':'none')+'" stroke="'+(on?'#5fa8ff':'#3b4350')+'" stroke-width="2" stroke-linejoin="round"/></svg></button>';}return '<div class="row sp"><b>💧 Eau</b><span class="sub">'+n+' / '+g+' verres · '+r1(n*0.25)+' L</span></div><div class="water" style="margin-top:8px">'+h+'<button class="btn sm" data-act="water" data-n="'+(n+1)+'" data-d="'+k+'" style="width:auto;height:32px">+1</button>'+(n?'<button class="btn sm ghost" data-act="water" data-n="'+(n-1)+'" data-d="'+k+'" style="width:auto;height:32px">−1</button>':'')+'</div>';}

 var ws=weekStart(t),days=workoutDays(),dn=['L','M','M','J','V','S','D'],dots='';for(var i=0;i<7;i++){var k=addDays(ws,i);dots+='<span><i class="'+(days[k]?'on':'')+'"></i>'+dn[i]+'</span>';}

/* Double progression : toutes les séries en haut de la fourchette → on ajoute du poids */
function progress(w){
 var ups=[];if(!w.programId||w.deload)return ups;
 var p=S.programs.find(function(x){return x.id===w.programId;});if(!p)return ups;
 w.items.forEach(function(it){
  if(it.pi==null)return;var pit=p.items[it.pi];if(!pit||pit.ex!==it.ex)return;
  var rg=parseRange(pit.reps),mn=rg[0],mx=rg[1],done=it.sets,msg='';if(!done.length||!mx)return;
  var full=done.length>=num(pit.sets);
  if(pit.bw||isCardio(it.ex)||(isTimed(it.ex)&&!(num(pit.w)>0))){
   if(full&&done.every(function(s){return num(s.r)>=mx;})){var st=isTimed(it.ex)?10:2;pit.reps=(mn+st)+'-'+(mx+st);msg='⬆️ Bravo ! Nouvelle fourchette : '+pit.reps+(isTimed(it.ex)?' s':' reps');}
   else msg='= Même exercice, vise '+(isTimed(it.ex)?'quelques secondes':'1 rep')+' de plus';
  }else{
   var ww=0;done.forEach(function(s){ww=Math.max(ww,num(s.w));});if(ww<=0)return;
   var inc=num(pit.inc)||2.5,target=num(pit.w);
   if(!target){target=ww;}
   else if(ww>target)target=ww;
   var allTop=full&&done.every(function(s){return num(s.w)>=target&&num(s.r)>=mx;});
   var anyLow=done.some(function(s){return num(s.r)<mn;});
   if(!num(pit.w)&&!allTop){pit.w=target;pit.fails=0;msg='🎯 Charge enregistrée : '+kgs(target)+' kg. Ajoute des reps jusqu\u2019à '+pit.sets+' × '+mx;}
   else if(allTop){pit.w=Math.round((target+inc)*100)/100;pit.fails=0;msg='⬆️ +'+kgs(inc)+' kg → '+kgs(pit.w)+' kg (vise '+mn+' reps)';}
   else if(anyLow){pit.fails=(pit.fails||0)+1;if(pit.fails>=2){pit.w=Math.max(inc,roundTo(target*0.9,inc));pit.fails=0;msg='⬇️ 2 séances difficiles : on repart à '+kgs(pit.w)+' kg';}else{pit.w=target;msg='= Garde '+kgs(target)+' kg, vise '+mn+' reps partout';}}
   else{pit.w=target;pit.fails=0;msg='= Garde '+kgs(target)+' kg, ajoute 1 rep';}
  }
  pit.msg=msg;ups.push({ex:it.ex,msg:msg});
 });
 return ups;
}

function sessDate(wk,c){var d=parseD(addDays(wk,c.off));return d.getDate()+' '+MSH[d.getMonth()];}
function vPrep(){
 var wk=curWk(),w=npWeek(wk),cfg=sessCfg(w.n),h=weekNav(wk);
 cfg.forEach(function(c,i){var s=w.sess[i],por=c.covers.length;
  h+='<div class="card"><div class="row sp"><div><span class="pill acc">🍳 '+c.lb+' '+sessDate(wk,c)+'</span><h2 style="margin:8px 0 2px">Pour '+c.covers.map(function(d){return DKN[d].toLowerCase();}).join(', ')+'</h2><div class="sub">'+por*2+' boîtes · environ '+(Math.max(REC[s.l].time,REC[s.dn].time)+20)+' min en cuisinant les deux en parallèle</div></div></div>';

   h+='<div class="recb"><div class="row sp"><b style="font-size:15px">'+rc.emo+' '+esc(rc.name)+'</b></div><div class="sub">'+x[1]+' · × '+por+' portions · par portion : '+mline(m)+'</div>';
   h+='<div class="ingl">'+ing.map(function(it){return '<div class="kv"><span>'+esc(ING[it[0]][0])+'</span><span>'+fmtQty(it[0],it[1]*por)+'</span></div>';}).join('')+'<div class="sub" style="margin-top:4px;font-size:12px">+ '+rc.extra.join(', ')+'</div></div>';
   h+='<ol class="steps">'+rc.steps.map(function(st){return '<li>'+esc(st)+'</li>';}).join('')+'</ol><div class="sub" style="font-size:12px">🧊 Boîtes hermétiques au frigo, '+rc.keep+' jours max'+(rc.prot==='saumon'?' (le saumon se garde moins longtemps : mange-le en premier)':'')+'.</div></div>';});
  h+='</div>';});
 h+='<div class="sub" style="text-align:center;margin-bottom:10px">Week-end : pas de repas prévu 🎉</div>';
 h+='<div class="card"><h2>💡 Astuces meal prep</h2><div class="kv" style="display:block"><div class="sub">Lance d’abord ce qui cuit le plus longtemps (riz complet, pommes de terre) et utilise 2 feux en même temps : une casserole pour le féculent, une poêle pour la viande ou le poisson.</div></div><div class="kv" style="display:block"><div class="sub">Laisse refroidir avant de fermer les boîtes. Mets les sauces et l’avocat à part.</div></div><div class="kv" style="display:block"><div class="sub">Tu peux congeler les boîtes du 3e jour et les sortir la veille.</div></div></div>';
 return h;
}
function shopItems(wk,w,filter){var cfg=sessCfg(w.n),agg={},extras={};
 cfg.forEach(function(c,i){if(filter!=null&&filter!==i)return;var s=w.sess[i],por=c.covers.length;[s.l,s.dn].forEach(function(id){var rc=REC[id];rIng(rc).forEach(function(it){agg[it[0]]=(agg[it[0]]||0)+it[1]*por;});rc.extra.forEach(function(e){extras[e]=1;});});
  c.covers.forEach(function(day){snackOf(DK.indexOf(day)).ing.forEach(function(it){agg[it[0]]=(agg[it[0]]||0)+it[1];});});});
 return {agg:agg,extras:Object.keys(extras)};}
function vCourses(){
 var wk=curWk(),w=npWeek(wk),cfg=sessCfg(w.n),f=UI.npf==null?null:UI.npf;if(f!=null&&f>=cfg.length)f=null;
 var sh=shopItems(wk,w,f),h=weekNav(wk);
 h+='<div class="chips" style="margin-bottom:8px">'+[['','Toute la semaine']].concat(cfg.map(function(c,i){return [String(i),'Pour '+c.lb.toLowerCase().replace(' soir','')];})).map(function(o){return '<span class="chip'+((f==null&&o[0]==='')||String(f)===o[0]?' on':'')+'" data-act="npf" data-v="'+o[0]+'">'+o[1]+'</span>';}).join('')+'</div>';
 var keys=Object.keys(sh.agg).filter(function(k){return k!=='whey';}),done=keys.filter(function(k){return w.checked[k];}).length;
 h+='<div class="card"><div class="row sp"><b>'+done+' / '+keys.length+' articles</b><button class="btn sm" data-act="copyShop">📋 Copier</button></div><div style="margin-top:8px">'+bar(done,keys.length||1,'var(--acc)')+'</div></div>';
 RAYONS.forEach(function(ry,ri){var ks=keys.filter(function(k){return ING[k][6]===ri;}).sort(function(a,b){return ING[a][0].localeCompare(ING[b][0]);});if(!ks.length)return;
  h+='<h3>'+ry+'</h3><div class="card list shop" style="padding:4px 14px">'+ks.map(function(k){var on=!!w.checked[k];return '<div class="it'+(on?' on':'')+'" data-act="npChk" data-k="'+k+'"><span class="box">'+(on?'✓':'')+'</span><span class="grow nm">'+esc(ING[k][0])+'</span><span style="text-align:right">'+fmtQty(k,sh.agg[k])+'</span></div>';}).join('')+'</div>';});
 h+='<div class="card"><div class="sub">🧂 À avoir dans le placard : '+esc(sh.extras.join(', '))+', sel, poivre.</div><div class="sub" style="margin-top:6px">🥤 Whey : tu en as déjà (≈ '+Math.round((sh.agg.whey||0))+' g sur la période).</div></div>';
 return h;
}
function shopText(){var wk=curWk(),w=npWeek(wk),f=UI.npf==null?null:UI.npf,sh=shopItems(wk,w,f),d=parseD(wk),out='🛒 Courses – semaine du '+d.getDate()+' '+MSH[d.getMonth()]+'\n';
 RAYONS.forEach(function(ry,ri){var ks=Object.keys(sh.agg).filter(function(k){return k!=='whey'&&ING[k][6]===ri;});if(!ks.length)return;out+='\n'+ry+'\n';ks.forEach(function(k){out+=(w.checked[k]?'☑ ':'☐ ')+ING[k][0]+' : '+fmtQtyTxt(k,sh.agg[k])+'\n';});});
 out+='\nPlacard : '+sh.extras.join(', ');return out;}
function recipeSheet(id){var rc=REC[id];if(!rc)return;var ing=rIng(rc),m=mac(ing);
 sheet('<h2>'+rc.emo+' '+esc(rc.name)+'</h2><div class="sub">Pour 1 portion · '+rc.time+' min · se garde '+rc.keep+' jours</div><div class="grid3" style="margin:12px 0"><div class="stat"><b>'+fmt(m.kcal)+'</b><span>kcal</span></div><div class="stat"><b>'+Math.round(m.p)+' g</b><span>protéines</span></div><div class="stat"><b>'+Math.round(m.fib)+' g</b><span>fibres</span></div></div>'+ing.map(function(it){return '<div class="kv"><span>'+esc(ING[it[0]][0])+'</span><span>'+fmtQty(it[0],it[1])+'</span></div>';}).join('')+'<div class="sub" style="margin:6px 0 10px">+ '+rc.extra.join(', ')+'</div><ol class="steps">'+rc.steps.map(function(st){return '<li>'+esc(st)+'</li>';}).join('')+'</ol><button class="btn pri blk" data-act="closeSheet">Fermer</button>');}
